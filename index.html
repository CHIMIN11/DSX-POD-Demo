<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Vera Rubin DSX POD</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Semi+Condensed:wght@500;700&family=Noto+Sans+TC:wght@400;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: full-bleed studio-black 3D stage; chapter caption top-left, transport rail (play · chapters · x-ray) pinned bottom */
:root{
  --bg:#050607; --panel:rgba(12,14,17,.8); --line:#262a31; --fg:#ecebe7; --mute:#8a8f97;
  --green:#7ccf22; --red:#e8382f; --cool:#3ec5ff; --gold:#f2b03a;
  --f-disp:"Saira Semi Condensed","Arial Narrow",sans-serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--fg);font-family:var(--f-body)}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.cap{position:fixed;top:calc(env(safe-area-inset-top,0px) + 16px);left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));pointer-events:none;max-width:560px;transition:opacity .45s}
.cap.fade{opacity:0}
.cap{text-shadow:0 1px 2px rgba(0,0,0,.55),0 0 18px rgba(0,0,0,.45)}
.cap p{color:#c9ccd1}
.eyebrow{font:600 11px/1 var(--f-mono);letter-spacing:.2em;color:var(--green);text-transform:uppercase}
.cap h1{margin:8px 0 6px;font:700 clamp(26px,5vw,48px)/1 var(--f-disp);letter-spacing:.01em;text-wrap:balance}
.stat{font:600 clamp(14px,2.2vw,18px)/1.3 var(--f-mono);font-variant-numeric:tabular-nums;color:var(--fg);display:flex;flex-wrap:wrap;gap:4px 14px}
.stat span{border-left:2px solid var(--green);padding-left:8px}
.cap p{margin:10px 0 0;font-size:14px;line-height:1.6;color:var(--mute);max-width:40ch}
.rail{position:fixed;left:0;right:0;bottom:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px calc(env(safe-area-inset-bottom,0px) + 14px);background:linear-gradient(to top,rgba(5,6,7,.96) 55%,rgba(5,6,7,0));display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:8px;align-items:stretch}
.ctl{flex:0 0 auto;font:600 13px var(--f-body);color:var(--fg);background:#101317;border:1px solid var(--line);border-radius:4px;padding:0 12px;min-height:40px;cursor:pointer;display:flex;align-items:center;gap:6px}
.ctl[aria-pressed="true"]{border-color:var(--cool);color:var(--cool)}
.ctl:disabled{opacity:.35;cursor:default}
.ctl:focus-visible,.chap:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.chaps{flex:1;min-width:0;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.chap{flex:1 0 92px;position:relative;text-align:left;background:#0d1013;border:1px solid var(--line);border-radius:4px;color:var(--mute);padding:7px 9px 9px;cursor:pointer;font:12px/1.3 var(--f-body);overflow:hidden}
.chap b{display:block;font:600 10px var(--f-mono);letter-spacing:.1em;margin-bottom:2px}
.chap.on{color:var(--fg);border-color:#3a4049}
.chap i{position:absolute;left:0;bottom:0;height:3px;background:var(--green);width:0}
.note{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font:11px var(--f-mono);color:var(--mute)}
@media (max-width:640px){
  .cap p{display:none}.note .hint{display:none}
  .cap h1{font-size:clamp(24px,7.2vw,32px)}
  .stat{font-size:13px}
  .rail{padding-block:20px calc(env(safe-area-inset-bottom,0px) + 10px);gap:6px}
  /* phone: chapters get their own swipeable strip; transport controls sit in one even row below */
  .row{flex-wrap:wrap;gap:6px}
  .chaps{order:-1;flex:1 0 100%;scroll-snap-type:x mandatory;scroll-padding-left:0;-webkit-overflow-scrolling:touch;mask-image:linear-gradient(to right,#000 85%,transparent)}
  .chap{flex:0 0 132px;scroll-snap-align:start;padding:6px 9px 8px;font-size:12px}
  .chap .ct{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .ctl{flex:1 1 0;justify-content:center;min-height:40px;padding:0 6px;font-size:12px;white-space:nowrap}
  #play{flex:0 0 52px}
  .note{font-size:10px;line-height:1.4}
}
</style>

<canvas id="scene" aria-label="NVIDIA Vera Rubin DSX POD 貨櫃式 AI 工廠 3D 演示"></canvas>

<div class="cap" id="cap">
  <div class="eyebrow" id="c-eye"></div>
  <h1 id="c-title"></h1>
  <div class="stat" id="c-stat"></div>
  <p id="c-body"></p>
</div>

<div class="rail">
  <div class="row">
    <button class="ctl" id="play" aria-label="Pause">❚❚</button>
    <div class="chaps" id="chaps" role="group" aria-label="章節"></div>
    <button class="ctl" id="doors" aria-pressed="false" disabled>開門</button>
    <button class="ctl" id="xray" aria-pressed="false" disabled>透視</button>
    <button class="ctl" id="lang" aria-label="Switch language">EN</button>
  </div>
  <div class="note"><span id="note-src">數據取自 GTC 主題演講與 NVIDIA 新聞稿（2026/10/21）· 場景為概念示意</span><span class="hint" id="note-hint">拖曳旋轉 · 滾輪/雙指縮放</span></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/objects/Reflector.js"></script>
<script>
(()=>{
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const CH=[
 {t:0, eye:'Vera Rubin NVL72', title:'一座機櫃，一台電腦', stat:['每種工作負載','每個模型'], body:'NVL72 機櫃級系統：以 NVLink 把整櫃 GPU 串成單一運算體。', en:{title:'One Rack, One Computer', stat:['Every workload','Every model'], body:'The NVL72 rack-scale system: NVLink joins every GPU in the rack into a single machine.'}},
 {t:5, eye:'Rack Line-Up', title:'機櫃組合，完成佈線', stat:['3 組機櫃','運算 · 電源 · 網路'], body:'先把未接線的 NVL72 運算櫃、電源櫃與網路櫃排成三組，再完成機櫃間的金色線纜。', en:{title:'Line Up the Racks, Then Cable', stat:['3 rack groups','Compute · Power · Network'], body:'Uncabled NVL72 compute, power and network racks are lined up in three groups, then the gold rack-to-rack cabling goes in.'}},
 {t:11,eye:'Vera Rubin NVL72 DSX POD', title:'整櫃整合進貨櫃', stat:['25 exaFLOPS AI','17 km 網路線材'], body:'運算機櫃、網路、配電、消防與液冷管線，在工廠內一次整合。', en:{title:'Integrated Into the Container', stat:['25 exaFLOPS of AI','17 km of networking cable'], body:'Compute racks, networking, power distribution, fire suppression and liquid-cooling piping are integrated in the factory in one pass.'}},
 {t:18,eye:'Factory-Built · Pre-Tested', title:'封櫃，整台出貨', stat:['28,500 kg','1,000 萬個元件'], body:'機櫃間佈線、配電、液冷與管線都在工廠完成，並在運送前做功能驗證。', en:{title:'Sealed and Shipped Whole', stat:['28,500 kg','10 million components'], body:'Rack-to-rack cabling, power, liquid cooling and piping are completed in the factory and functionally validated before transport.'}},
 {t:24,eye:'DSX POD Dry Coolers', title:'乾式冷卻器', stat:['零耗水'], body:'冷卻模組直接疊在 POD 上方，以風扇散熱，不消耗水資源。', en:{title:'Dry Coolers', stat:['Zero water consumption'], body:'The cooling module stacks directly on top of the POD and rejects heat with fans, using no water.'}},
 {t:30,eye:'800 VDC Power Center', title:'800 VDC 電力中心', stat:['供電更多','銅材減少 45%'], body:'高壓直流母線直送 POD，降低轉換損耗與線材用量。', en:{title:'800 VDC Power Center', stat:['More power','45% less copper'], body:'A high-voltage DC busway feeds each POD directly, cutting conversion losses and cable use.'}},
 {t:36,eye:'NVIDIA DSX PODs', title:'貨櫃就是 AI 工廠', stat:['6 個月 → 最快 14 天','2027 年初全球交付'], body:'在已備妥的場地，部署時間從六個月縮短到最快 14 天，以模組化複製擴展成整座 AI 工廠園區。', en:{title:'The Container Is the AI Factory', stat:['6 months → as little as 14 days','Worldwide delivery early 2027'], body:'At a prepared site, deployment drops from six months to as little as 14 days, and modular PODs scale out into a full AI factory campus.'}},
];
const END=46;
// global time Tn vs. build time: the line-up chapter (Tn 5–11) holds every non-rack build step at 5
const buildT=Tn=>Tn<5?Tn:Tn<11?5:Tn-6;

// ---------- renderer ----------
const canvas=document.getElementById('scene');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=0.95;
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene();scene.background=new THREE.Color('#050607');scene.fog=new THREE.Fog('#050607',35,230);
const camera=new THREE.PerspectiveCamera(40,1,0.1,900);
const controls=new THREE.OrbitControls(camera,canvas);
controls.enableDamping=true;controls.maxPolarAngle=Math.PI*0.48;controls.minDistance=2.5;controls.maxDistance=320;

const hemi=new THREE.HemisphereLight('#dfe8f5','#15110c',0.34);scene.add(hemi);
const key=new THREE.DirectionalLight('#fff3e2',1.05);key.position.set(10,18,12);key.castShadow=true;
key.shadow.mapSize.set(2048,2048);Object.assign(key.shadow.camera,{left:-20,right:20,top:20,bottom:-20,near:1,far:70});key.shadow.bias=-0.0004;scene.add(key);
const fill=new THREE.DirectionalLight('#9cc7ff',0.35);fill.position.set(-12,6,-8);scene.add(fill);
const inners=[-4,0,4].map(x=>{const l=new THREE.PointLight('#fff1dc',0,9,1.4);l.position.set(x,2.3,0.6);scene.add(l);return l;});

const ground=new THREE.Mesh(new THREE.PlaneGeometry(800,800),new THREE.MeshStandardMaterial({color:'#030304',roughness:1,metalness:0}));
ground.rotation.x=-Math.PI/2;ground.position.y=-0.03;ground.receiveShadow=true;scene.add(ground);
const grid=new THREE.GridHelper(400,100,'#0f1114','#0b0c0e');grid.visible=false;scene.add(grid);
// studio floor: polished black 1.2 m tiles over a soft real-time reflection, with a pool of light under the racks
const texTile=tex(512,512,(g,w,h)=>{
  for(let i=0;i<4;i++)for(let j=0;j<4;j++){const v=8+Math.floor(Math.random()*5);g.fillStyle=`rgb(${v},${v+1},${v+3})`;g.fillRect(i*128,j*128,128,128);
    for(let k=0;k<260;k++){const a=Math.random()*0.05;g.fillStyle=`rgba(255,255,255,${a})`;g.fillRect(i*128+Math.random()*128,j*128+Math.random()*128,1,1);}}
  g.fillStyle='#17191d';for(let i=0;i<=4;i++){g.fillRect(i*128-1,0,2,h);g.fillRect(0,i*128-1,w,2);}
  const sh=g.createLinearGradient(0,0,w,h);sh.addColorStop(0,'rgba(255,255,255,.025)');sh.addColorStop(.5,'rgba(255,255,255,0)');sh.addColorStop(1,'rgba(255,255,255,.02)');g.fillStyle=sh;g.fillRect(0,0,w,h);});
texTile.wrapS=texTile.wrapT=THREE.RepeatWrapping;texTile.repeat.set(800/4.8,800/4.8);
const floorMat=new THREE.MeshStandardMaterial({map:texTile,color:'#ffffff',roughness:.66,metalness:.12,transparent:true,opacity:.86});
const floor=new THREE.Mesh(new THREE.PlaneGeometry(800,800),floorMat);floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);
let mirror=null;
if(THREE.Reflector){const dpr=Math.min(devicePixelRatio,2);
  mirror=new THREE.Reflector(new THREE.PlaneGeometry(70,46),{textureWidth:Math.round(innerWidth*dpr*0.5),textureHeight:Math.round(innerHeight*dpr*0.5),color:0x50545a});
  mirror.rotation.x=-Math.PI/2;mirror.position.set(-2,-0.006,-2);scene.add(mirror);}
const texPool=tex(256,256,(g,w,h)=>{const r=g.createRadialGradient(128,128,0,128,128,128);r.addColorStop(0,'rgba(255,255,255,1)');r.addColorStop(.55,'rgba(255,255,255,.35)');r.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=r;g.fillRect(0,0,w,h);});
const pool=new THREE.Mesh(new THREE.PlaneGeometry(30,13),new THREE.MeshBasicMaterial({map:texPool,color:'#a9b2bd',transparent:true,opacity:.1,blending:THREE.AdditiveBlending,depthWrite:false}));
pool.rotation.x=-Math.PI/2;pool.position.set(0,0.004,0.6);scene.add(pool);

// ---------- textures ----------
function tex(w,h,draw){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;t.anisotropy=8;return t;}
const WHITE='#e7e9ec',GREEN='#74c41e';
function ribs(g,w,y0,y1,step,light,dark){for(let x=0;x<w;x+=step){g.fillStyle=light;g.fillRect(x,y0,step*0.45,y1-y0);g.fillStyle=dark;g.fillRect(x+step*0.45,y0,2,y1-y0);}}
function panelDraw(logo){return (g,w,h)=>{
  g.fillStyle=WHITE;g.fillRect(0,0,w,h);ribs(g,w,0,h*0.7,32,'#eef0f2','#c9cdd2');
  g.fillStyle=GREEN;g.fillRect(0,h*0.7,w,h*0.3);ribs(g,w,h*0.7,h,32,'#80d127','#5ea312');
  g.fillStyle='#aeb3ba';g.fillRect(0,0,3,h);g.fillRect(w-3,0,3,h);
  g.fillStyle='#9aa0a8';g.fillRect(w-36,h*0.46,8,46);g.fillRect(w-40,h*0.12,16,6);g.fillRect(w-40,h*0.86,16,6);
  if(logo){g.fillStyle='#2a2e35';g.font='700 34px "Saira Semi Condensed", Arial Narrow, sans-serif';g.fillText('DSX POD',26,64);g.fillStyle=GREEN;g.fillRect(26,74,60,5);}
};}
const texPanel=tex(256,512,panelDraw(false)), texPanelLogo=tex(256,512,panelDraw(true));
const texWall=tex(256,512,panelDraw(false));texWall.wrapS=THREE.RepeatWrapping;texWall.repeat.set(12,1);
function ribSeg(g,x,w,h,step){
  g.fillStyle=WHITE;g.fillRect(x,0,w,h*0.7);
  for(let i=x;i<x+w;i+=step){g.fillStyle='#f4f5f7';g.fillRect(i,0,step*0.42,h*0.7);g.fillStyle='#c3c7cc';g.fillRect(i+step*0.42,0,2,h*0.7);}
  g.fillStyle=GREEN;g.fillRect(x,h*0.7,w,h*0.3);
  for(let i=x;i<x+w;i+=step){g.fillStyle='#88d630';g.fillRect(i,h*0.7,step*0.42,h*0.3);g.fillStyle='#599b10';g.fillRect(i+step*0.42,h*0.7,2,h*0.3);}
  g.fillStyle='#a9aeb5';g.fillRect(x,0,2,h);g.fillRect(x+w-2,0,2,h);
}
function doorSeg(g,x,w,h){
  const gr=g.createLinearGradient(x,0,x+w,0);gr.addColorStop(0,'#eef0f2');gr.addColorStop(1,'#dde0e4');
  g.fillStyle=gr;g.fillRect(x,0,w,h*0.7);g.fillStyle=GREEN;g.fillRect(x,h*0.7,w,h*0.3);
  g.fillStyle='rgba(0,0,0,.07)';g.fillRect(x,h*0.7,w,3);
  g.fillStyle='#aab0b7';g.fillRect(x,0,3,h);g.fillRect(x+w-3,0,3,h);g.fillRect(x,0,w,3);g.fillRect(x,h-3,w,3);
}
function logoMark(g,x){g.fillStyle='#2a2e35';g.font='700 30px "Saira Semi Condensed", Arial Narrow, sans-serif';g.fillText('DSX POD',x+22,58);g.fillStyle=GREEN;g.fillRect(x+22,68,54,5);}
const texEnd=tex(256,512,(g,w,h)=>ribSeg(g,0,w,h,18));
const texBase=tex(1024,32,(g,w,h)=>{g.fillStyle='#8f959d';g.fillRect(0,0,w,h);g.fillStyle='#6f757d';g.fillRect(0,0,w,3);g.fillRect(0,h-3,w,3);
  g.fillStyle='#1b1d21';[0.07,0.15,0.85,0.93].forEach(f=>g.fillRect(f*w-22,8,44,h-14));});
const texLouver=tex(512,256,(g,w,h)=>{
  g.fillStyle=WHITE;g.fillRect(0,0,w,h);
  for(let i=0;i<5;i++){const x=14+i*100;g.fillStyle='#4a4f57';g.fillRect(x,30,84,120);
    g.fillStyle='#d5d8dc';for(let s=0;s<10;s++)g.fillRect(x+4,36+s*11.5,76,5);}
  ribs(g,w,165,h,24,'#eceef0','#c5c9ce');
  g.fillStyle='#aeb3ba';g.fillRect(0,160,w,3);
});
texLouver.wrapS=THREE.RepeatWrapping;
const texLouverHero=texLouver.clone();texLouverHero.needsUpdate=true;texLouverHero.repeat.set(2.4,1);
const texFanTop=tex(512,128,(g,w,h)=>{g.fillStyle='#cfd3d8';g.fillRect(0,0,w,h);
  for(let i=0;i<6;i++)for(let j=0;j<2;j++){g.fillStyle='#24272c';g.beginPath();g.arc(43+i*85,32+j*64,27,0,7);g.fill();g.fillStyle='#4a4f57';g.beginPath();g.arc(43+i*85,32+j*64,7,0,7);g.fill();}});
// power center skin from the keynote: corrugated white shell, two columns of three stacked panel doors with pull handles
const texPower=tex(512,256,(g,w,h)=>{g.fillStyle='#e4e6e9';g.fillRect(0,0,w,h);
  for(let x=0;x<w;x+=12){g.fillStyle='#f1f2f4';g.fillRect(x,0,5,h);g.fillStyle='#c6cacf';g.fillRect(x+5,0,2,h);}
  g.fillStyle='#b3b8be';g.fillRect(0,0,w,4);g.fillRect(0,h-6,w,6);g.fillRect(0,0,4,h);g.fillRect(w-4,0,4,h);
  [[120,0],[262,1]].forEach(([x0])=>{g.fillStyle='#aab0b7';g.fillRect(x0-14,8,6,h-16);
    for(let r=0;r<3;r++){const y=40+r*66;g.fillStyle='#eceef0';g.fillRect(x0,y,130,52);g.strokeStyle='#a9aeb5';g.lineWidth=2;g.strokeRect(x0,y,130,52);
      g.fillStyle='#d6d9dd';g.fillRect(x0+4,y+4,122,8);g.fillStyle='#8e949b';g.fillRect(x0+52,y+30,26,5);}});
  g.fillStyle='#aab0b7';g.fillRect(400,8,6,h-16);});
function cables(g,count,x0,dir){for(let i=0;i<count;i++){const y=26+(i/count)*460;
  g.strokeStyle=`hsl(${36+Math.random()*10},92%,${46+Math.random()*20}%)`;g.lineWidth=2+Math.random();
  g.beginPath();g.moveTo(x0,y);const r=30+Math.random()*24;g.bezierCurveTo(x0+dir*r,y-8,x0+dir*r,36,x0+dir*(8+Math.random()*26),8);g.stroke();}}
const texCompute=tex(256,512,(g,w,h)=>{g.fillStyle='#090a0c';g.fillRect(0,0,w,h);
  for(let i=0;i<20;i++){const y=24+i*23;g.fillStyle=(i===9||i===10)?'#2b2f36':'#cfd2d7';g.fillRect(74,y,108,16);
    g.fillStyle='#202329';for(let k=0;k<5;k++)g.fillRect(82+k*17,y+5,11,6);g.fillStyle='#9dff4a';g.fillRect(172,y+6,4,4);}
  cables(g,30,74,-1);cables(g,30,182,1);});
const texNet=tex(256,512,(g,w,h)=>{g.fillStyle='#090a0c';g.fillRect(0,0,w,h);
  for(let i=0;i<14;i++){const y=60+i*30;g.fillStyle='#2a2d33';g.fillRect(40,y,176,10);g.fillStyle='#3ec5ff';for(let k=0;k<16;k++)g.fillRect(46+k*10.5,y+3,4,4);}
  cables(g,70,40,-1);cables(g,70,216,1);});
const texElec=tex(256,512,(g,w,h)=>{g.fillStyle='#dfe2e6';g.fillRect(0,0,w,h);g.fillStyle='#c4c8ce';g.fillRect(14,14,w-28,h-28);
  for(let r=0;r<6;r++)for(let c=0;c<3;c++){const x=40+c*64,y=150+r*50;g.fillStyle='#565b63';g.fillRect(x,y,44,32);

const LG=()=>UI[lang];const txt=c=>lang==='en'?{...c,...c.en}:c;
function applyLang(){const u=LG();document.documentElement.lang=lang==='en'?'en':'zh-Hant';
  document.getElementById('lang').textContent=u.btn;document.getElementById('xray').textContent=u.xray;
  doorBtn.textContent=doorsOpen?u.close:u.open;document.getElementById('note-src').textContent=u.src;document.getElementById('note-hint').textContent=u.hint;
  document.getElementById('chaps').setAttribute('aria-label',u.chaps);
  chapBtns.forEach((b,i)=>{b.querySelector('.ct').textContent=txt(CH[i]).title;});
  syncPlay();if(chIdx>=0)setCaption(chIdx);}
document.getElementById('lang').addEventListener('click',()=>{lang=lang==='en'?'zh':'en';try{localStorage.setItem('dsx-lang2',lang);}catch(e){}applyLang();});
function syncPlay(){playBtn.textContent=playing?'❚❚':'▶';playBtn.setAttribute('aria-label',playing?LG().pause:LG().play);}
playBtn.addEventListener('click',()=>{if(!playing&&T>=END-0.01)T=0;playing=!playing;syncPlay();});
xrayBtn.addEventListener('click',()=>{xray=!xray;xrayBtn.setAttribute('aria-pressed',xray);});
applyLang();
controls.addEventListener('start',()=>{userCam=true;});

const narrow=()=>innerWidth<640;
function view(i){
  const n=narrow();
  return [
    {p:n?[2.3,2.4,5.6]:[2.0,2.0,4.4],t:[racks[HERO].position.x,1.3,-0.4]},
    {p:n?[3.5,2.6,13]:[3,2.3,9.5],t:[0.3,1.1,-0.5]},
    {p:n?[2,2.2,17]:[1.6,1.9,11.5],t:[0,1.35,-0.3]},
    {p:n?[12,5,18]:[10,4.2,13.5],t:[0,1.5,0]},
    {p:n?[13,9,19]:[11,7,15],t:[0,2.6,0]},
    {p:n?[2,8,22]:[1.5,6,16],t:[-7,1.6,0]},
    {p:n?[60,95,240]:[40,72,170],t:[10,0,-22]},
  ][i];
}
const cap=document.getElementById('cap');
function setCaption(i){
  cap.classList.add('fade');
  setTimeout(()=>{const c=txt(CH[i]);
    document.getElementById('c-eye').textContent=c.eye;document.getElementById('c-title').textContent=c.title;
    document.getElementById('c-stat').innerHTML=c.stat.map(s=>`<span>${s}</span>`).join('');document.getElementById('c-body').textContent=c.body;
    cap.classList.remove('fade');},chIdx<0?0:280);
}

function update(Tn,dt,time){
  const T=buildT(Tn);
  anim.forEach(({o,a,b,off,useN})=>{const tt=useN?Tn:T;const p=ease(clamp((tt-a)/(b-a)));o.position.copy(o.userData.base).addScaledVector(off,1-p);o.visible=p>0.002;});
  const deck=ease(clamp((T-5)/1.1));
  racks.forEach(r=>{const R=r.userData.rack;r.position.y-=(1-deck)*(B+0.02);
    const on=Tn>=R.at;if(R.bare){const want=on?R.cabled.map:R.bare;if(R.front.map!==want){R.front.map=want;R.front.emissiveMap=want;}}
    const sp=ease(clamp((Tn-R.at)/0.5));R.stubs.forEach(st=>{st.visible=sp>0.01;st.scale.set(sp,0.9*sp,sp);});});
  // chapter
  let ci=0;CH.forEach((c,i)=>{if(Tn>=c.t)ci=i;});
  if(ci!==chIdx){setCaption(ci);chIdx=ci;userCam=false;const v=view(ci);camGoal={p:v3(...v.p),t:v3(...v.t)};}
  if(ci!==lastScrolled){lastScrolled=ci;const b=chapBtns[ci];const cx=chapsEl;if(cx.scrollWidth>cx.clientWidth)cx.scrollTo({left:Math.max(0,b.offsetLeft-cx.offsetLeft-8),behavior:reduce?'auto':'smooth'});}
  chapBtns.forEach((b,i)=>{b.classList.toggle('on',i===ci);const s=CH[i].t,e=i<CH.length-1?CH[i+1].t:END;b.lastChild.style.width=(clamp((Tn-s)/(e-s))*100)+'%';});
  xrayBtn.disabled=T<13;if(T<13&&xray){xray=false;xrayBtn.setAttribute('aria-pressed','false');}
  const dOk=T>=14.6;doorBtn.disabled=!dOk;if(!dOk&&doorsOpen){doorsOpen=false;doorBtn.setAttribute('aria-pressed','false');doorBtn.textContent=LG().open;}
  doors.forEach((d,i)=>{const g=doorsOpen?-1.72*d.userData.dir:0;d.rotation.y+=(g-d.rotation.y)*Math.min(1,dt*(3+i*0.25));});
  // shell opacity
  const op=xray?0.12:1;shellMats.forEach(m=>{m.opacity+=(op-m.opacity)*0.12;m.depthWrite=m.opacity>0.9;});
  // interior glow
  const interiorOpen=(T>=5&&T<14.5)||xray||doorsOpen;
  inners.forEach(l=>{l.intensity+=((interiorOpen?0.5:0)-l.intensity)*0.08;});
  const pulse=0.5+0.5*Math.sin(time*2.6);
  racks.forEach(r=>{const R=r.userData.rack;if(R.bare)R.front.emissiveIntensity=(Tn>=R.at?0.04+pulse*0.04:0.05);});M.rackN.emissiveIntensity=0.3;
  // fans
  const fanOn=T>=19.6?1:0;fans.forEach((f,i)=>{f.rotation.y+=dt*(9+i%3)*fanOn;});
  // power flow
  const flowOn=T>=26.3;flow.material.opacity+=((flowOn?1:0)-flow.material.opacity)*0.1;
  for(let i=0;i<FLOW;i++){const u=((i/FLOW)+time*0.35)%1;const pnt=busA.clone().lerp(busB,u);pnt.y=0.52;dummy.position.copy(pnt);dummy.rotation.set(0,bus.rotation.y,0);dummy.scale.setScalar(1);dummy.updateMatrix();flow.setMatrixAt(i,dummy.matrix);}
  flow.instanceMatrix.needsUpdate=true;flow.visible=flow.material.opacity>0.01;
  placeCampus(T);
}

function resize(){renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();if(chIdx>=0&&!userCam){const v=view(chIdx);camGoal={p:v3(...v.p),t:v3(...v.t)};}}
addEventListener('resize',resize);resize();
{const v=view(0);camera.position.set(v.p[0]+3,v.p[1]+1,v.p[2]+4);controls.target.set(...v.t);}

let last=performance.now(),time=0;
function tick(now){
  const dt=Math.min(0.05,(now-last)/1000);last=now;time+=dt;
  if(playing){T+=dt;if(T>=END){T=END;playing=false;syncPlay();}}
  update(T,dt,time);
  if(camGoal&&!userCam){const k=reduce?1:0.03;camera.position.lerp(camGoal.p,k);controls.target.lerp(camGoal.t,k);if(camera.position.distanceTo(camGoal.p)<0.05)camGoal=null;}
  controls.update();renderer.render(scene,camera);requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
})();
</script>
